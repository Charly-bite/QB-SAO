<!-- Modal para notas de envío en Almacén -->
<div x-show="showEntregaNoteModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm" style="display: none;" x-cloak x-transition>
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden" @click.away="cancelEntregaNoteModal()">
        <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
            <h3 class="font-bold text-slate-800 text-lg">Nota de Envío</h3>
            <button @click="cancelEntregaNoteModal()" class="text-slate-400 hover:text-slate-600 focus:outline-none">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="p-6">
            <p class="text-sm text-slate-600 mb-4">Ingrese una nota o información adicional para este envío (Opcional):</p>
            <textarea x-model="entregaNoteText"
                @keydown.escape="cancelEntregaNoteModal()"
                @keydown.cmd.enter="confirmEntregaNoteModal()"
                @keydown.ctrl.enter="confirmEntregaNoteModal()"
                class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow" 
                rows="4" 
                placeholder="Ej: Entregado a la fletera, número de guía..."></textarea>
        </div>
        <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
            <button @click="cancelEntregaNoteModal()" :disabled="savingEntregaNote" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-200 bg-slate-100 rounded-lg transition-colors disabled:opacity-50">
                Cancelar
            </button>
            <button @click="confirmEntregaNoteModal()" :disabled="savingEntregaNote" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm disabled:opacity-50 flex items-center gap-2">
                <template x-if="savingEntregaNote">
                    <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </template>
                <span>Guardar y Actualizar</span>
            </button>
        </div>
    </div>
</div>
